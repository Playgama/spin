<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You boosted a game — Playgama Boost</title>
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/css/typography.css">
  <link rel="stylesheet" href="shared/css/components.css">
  <!-- ?v=…: raise the number with every change of these files. A browser may keep the old ones for ten minutes after the site is updated, and an old script with a new page is a broken machine. -->
  <link rel="stylesheet" href="css/share.css?v=9">
</head>
<body>
  <!-- Opened on a phone from the QR code of a win on the slot: share.html?g=<game id>&p=<players>. -->
  <main class="page">
    <img class="brand" src="assets/strip/playgama-pill.svg" alt="Playgama">
    <!-- The squircle of the game covers on playgama.ai: their path, applied the same way (clip-path: url(#…)). -->
    <svg class="defs" aria-hidden="true"><clipPath id="cover-squircle" clipPathUnits="objectBoundingBox" transform="scale(0.01)"><path d="M14.223 3.223Q22 0 50 0T85.777 3.223Q93.554 6.446 96.777 14.223T100 50Q100 78 96.777 85.777T85.777 96.777Q78 100 50 100T14.223 96.777Q6.446 93.554 3.223 85.777T0 50Q0 22 3.223 14.223T14.223 3.223Z"/></clipPath></svg>
    <!-- The cover, the prize and the title lead where Play Game does. -->
    <a class="game" id="game" target="_blank" rel="noopener">
      <img class="cover" id="cover" alt="" width="128" height="128" hidden>
      <h1 class="gain heading-promo-xxxl" id="gain"></h1>
      <p class="whom heading-promo-m" id="whom"></p>
    </a>
    <div class="ready" id="ready" hidden>
      <section class="post">
        <h2 class="post__label caption-m">Your post is ready</h2>
        <p class="post__text body-l" id="post"></p>
      </section>
      <!-- Icons: the library's assets/icons (social/linkedin, social/x, fontawesome/threads-brands, system/copy-24), inline so they take the button's colour. -->
      <a class="btn btn-l btn-fill is-inverse" id="linkedin" target="_blank" rel="noopener">
        <svg class="btn-icon-slot" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5714 2H3.42411C2.63839 2 2 2.64732 2 3.44196V20.558C2 21.3527 2.63839 22 3.42411 22H20.5714C21.3571 22 22 21.3527 22 20.558V3.44196C22 2.64732 21.3571 2 20.5714 2ZM8.04464 19.1429H5.08036V9.59821H8.04911V19.1429H8.04464ZM6.5625 8.29464C5.61161 8.29464 4.84375 7.52232 4.84375 6.57589C4.84375 5.62946 5.61161 4.85714 6.5625 4.85714C7.50893 4.85714 8.28125 5.62946 8.28125 6.57589C8.28125 7.52679 7.51339 8.29464 6.5625 8.29464ZM19.1562 19.1429H16.192V14.5C16.192 13.3929 16.1696 11.9688 14.6518 11.9688C13.1071 11.9688 12.8705 13.1741 12.8705 14.4196V19.1429H9.90625V9.59821H12.75V10.9018H12.7902C13.1875 10.1518 14.1563 9.36161 15.5982 9.36161C18.5982 9.36161 19.1562 11.3393 19.1562 13.9107V19.1429Z"/></svg>
        LinkedIn
      </a>
      <a class="btn btn-l btn-fill is-inverse" id="x" target="_blank" rel="noopener">
        <svg class="btn-icon-slot" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.7497 3H20.8179L14.1165 10.624L22 21H15.8288L10.9917 14.7087L5.46371 21H2.39113L9.55758 12.8438L2 3H8.32768L12.6953 8.75048L17.7497 3ZM16.6719 19.174H18.3711L7.402 4.73077H5.57671L16.6719 19.174Z"/></svg>
        X
      </a>
      <a class="btn btn-l btn-fill is-inverse" id="threads" target="_blank" rel="noopener">
        <svg class="btn-icon-slot" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="translate(3.25 2) scale(0.03906)"><path d="M331.5 235.7c2.2 .9 4.2 1.9 6.3 2.8c29.2 14.1 50.6 35.2 61.8 61.4c15.7 36.5 17.2 95.8-30.3 143.2c-36.2 36.2-80.3 52.5-142.6 53h-.3c-70.2-.5-124.1-24.1-160.4-70.2c-32.3-41-48.9-98.1-49.5-169.6V256v-.2C17 184.3 33.6 127.2 65.9 86.2C102.2 40.1 156.2 16.5 226.4 16h.3c70.3 .5 124.9 24 162.3 69.9c18.4 22.7 32 50 40.6 81.7l-40.4 10.8c-7.1-25.8-17.8-47.8-32.2-65.4c-29.2-35.8-73-54.2-130.5-54.6c-57 .5-100.1 18.8-128.2 54.4C72.1 146.1 58.5 194.3 58 256c.5 61.7 14.1 109.9 40.3 143.3c28 35.6 71.2 53.9 128.2 54.4c51.4-.4 85.4-12.6 113.7-40.9c32.3-32.2 31.7-71.8 21.4-95.9c-6.1-14.2-17.1-26-31.9-34.9c-3.7 26.9-11.8 48.3-24.7 64.8c-17.1 21.8-41.4 33.6-72.7 35.3c-23.6 1.3-46.3-4.4-63.9-16c-20.8-13.8-33-34.8-34.3-59.3c-2.5-48.3 35.7-83 95.2-86.4c21.1-1.2 40.9-.3 59.2 2.8c-2.4-14.8-7.3-26.6-14.6-35.2c-10-11.7-25.6-17.7-46.2-17.8H227c-16.6 0-39 4.6-53.3 26.3l-34.4-23.6c19.2-29.1 50.3-45.1 87.8-45.1h.8c62.6 .4 99.9 39.5 103.7 107.7l-.2 .2zm-156 68.8c1.3 25.1 28.4 36.8 54.6 35.3c25.6-1.4 54.6-11.4 59.5-73.2c-13.2-2.9-27.8-4.4-43.4-4.4c-4.8 0-9.6 .1-14.4 .4c-42.9 2.4-57.2 23.2-56.2 41.8l-.1 .1z"/></g></svg>
        Threads
      </a>
      <button class="btn btn-l btn-fill is-inverse" id="copy" type="button">
        <svg class="btn-icon-slot" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.4375 3H15.8004C16.2469 3 16.6758 3.1793 16.9922 3.4957L19.3793 5.88281C19.6957 6.19922 19.875 6.62812 19.875 7.07461V14.8125C19.875 15.7441 19.1191 16.5 18.1875 16.5H11.4375C10.5059 16.5 9.75 15.7441 9.75 14.8125V4.6875C9.75 3.75586 10.5059 3 11.4375 3ZM5.8125 7.5H8.625V9.75H6.375V18.75H13.125V17.625H15.375V19.3125C15.375 20.2441 14.6191 21 13.6875 21H5.8125C4.88086 21 4.125 20.2441 4.125 19.3125V9.1875C4.125 8.25586 4.88086 7.5 5.8125 7.5Z"/></svg>
        <span id="copy-label">Copy text</span>
      </button>
      <!-- The game's page on playgama.ai, in a new tab of the phone's browser. Icon: the library's assets/icons/system/play-24. -->
      <a class="btn btn-l btn-lime play" id="play" target="_blank" rel="noopener">
        <svg class="btn-icon-slot" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.0163 4.73626C9.52083 4.43163 8.89817 4.42159 8.39268 4.70614C7.88719 4.99068 7.57251 5.5263 7.57251 6.10879V17.8924C7.57251 18.4749 7.88719 19.0105 8.39268 19.2951C8.89817 19.5796 9.52083 19.5662 10.0163 19.2649L19.6574 13.3731C20.1361 13.0819 20.4274 12.563 20.4274 12.0006C20.4274 11.4382 20.1361 10.9227 19.6574 10.6281L10.0163 4.73626Z"/></svg>
        Play Game
      </a>
      <p class="hint body-s">On LinkedIn, paste the text: it's already copied.</p>
    </div>
  </main>
  <script type="module" src="js/share.js?v=10"></script>
</body>
</html>
